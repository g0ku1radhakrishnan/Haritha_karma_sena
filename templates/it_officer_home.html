{% include 'itofficer_header.html' %}

<style>
    /* Modern dashboard theme matched to previous UI */
    .page-container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
    }

    .dashboard-header {
        margin-bottom: 32px;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 16px;
    }

    .page-title {
        font-size: 2rem;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
        text-transform: capitalize;
    }
    
    .page-subtitle {
        color: #7f8c8d;
        margin: 6px 0 0 0;
        font-size: 0.95rem;
    }

    /* Grid layout for Dashboard Navigation Cards */
    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    /* Interactive Menu Cards */
    .menu-card {
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border: 1px solid #eef2f5;
        text-align: center;
        text-decoration: none;
        color: #2c3e50;
        font-weight: 600;
        font-size: 1.05rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100px;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .menu-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 15px rgba(52, 152, 219, 0.1);
        border-color: #3498db;
        color: #3498db;
    }

    .menu-card:active {
        transform: translateY(-1px);
    }
</style>

<div class="page-container">
    <div class="dashboard-header">
        <h1 class="page-title">Welcom it officer</h1>
        <p class="page-subtitle">Welcome to the IT Officer Control Center panel. Select a shortcut operational task below.</p>
    </div>

    <div class="dashboard-grid">
        <a href="/it_send_notification" class="menu-card">
            <span>Send Notification</span>
        </a>
        
        <a href="/it_office_view_hks" class="menu-card">
            <span>View HKS</span>
        </a>
        
        <a href="/it_officer_view_complaints" class="menu-card">
            <span>View Complaints</span>
        </a>
        
        <a href="/it_manage_products" class="menu-card">
            <span>Manage Products</span>
        </a>

        <a href="/itofficer_wastereport" class="menu-card">
            <span>Waste Report</span>
        </a>
    </div>
</div>

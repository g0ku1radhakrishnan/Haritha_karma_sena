{% include 'hks_normal_header.html' %}

<style>
    /* Modern styling theme matched to previous UI */
    .page-container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
    }

    .page-title {
        font-size: 2rem;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 24px;
        text-transform: capitalize;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 10px;
    }

    .table-responsive {
        width: 100%;
        overflow-x: auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        border-radius: 8px;
        background-color: #ffffff;
        border: 1px solid #eef2f5;
    }

    .custom-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    .custom-table th {
        background-color: #f8f9fa;
        color: #495057;
        font-weight: 600;
        padding: 16px;
        font-size: 0.95rem;
        border-bottom: 2px solid #dee2e6;
        white-space: nowrap;
    }

    .custom-table td {
        padding: 16px;
        vertical-align: top;
        border-bottom: 1px solid #ebebeb;
        color: #4f5d75;
        font-size: 0.95rem;
        line-height: 1.5;
    }

    .custom-table tr:hover {
        background-color: #fcfcfc;
    }

    .notification-title {
        font-weight: 600;
        color: #2c3e50;
    }

    .notification-date {
        color: #7f8c8d;
        white-space: nowrap;
        font-size: 0.9rem;
    }

    .no-data {
        text-align: center;
        color: #7f8c8d;
        font-style: italic;
        padding: 40px !important;
    }
</style>

<div class="page-container">
    <h1 class="page-title">IT Office Notifications</h1>

    <div class="table-responsive">
        <table class="custom-table">
            <thead>
                <tr>
                    <th style="width: 80px;">Sl No</th>
                    <th style="width: 250px;">Title</th>
                    <th>Description</th>
                    <th style="width: 150px;">Date</th>
                </tr>
            </thead>
            <tbody>
                {% for i in x %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td class="notification-title">{{ i.title }}</td>
                    <td>{{ i.description }}</td>
                    <td class="notification-date">{{ i.date }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="no-data">No Notifications Available.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% include 'public_footer.html' %}
